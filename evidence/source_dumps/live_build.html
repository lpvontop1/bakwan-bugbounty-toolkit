<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bakwan Fight Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --ink:#120818; --ink2:#1e0f2a; --ink3:#2c1740; --line:#000;
  --fire1:#ff4d1a; --fire2:#ff8a1f; --fire3:#ffc93c; --cream:#fff4e0; --muted:#b9a7c9;
  --good:#7bd88f; --cyan:#4fd1ff; --bad:#ff4d5e; --violet:#b47cff;
  --r:14px;
  --fd:'Bangers', 'Impact', system-ui, sans-serif;
  --fu:'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font-family:var(--fu);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:fixed;inset:0;overflow:hidden}
canvas{display:block}
#bg,#cv{position:absolute;inset:0;width:100%;height:100%}
#cv{touch-action:none;display:none}
body.in-battle #cv{display:block}
body.in-battle #bg{display:none}

.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex;animation:scrIn .28s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}

/* ---------- comic buttons */
.btn{position:relative;font-family:var(--fd);letter-spacing:.06em;font-size:clamp(18px,2.6vmin + 8px,30px);
  padding:.42em 1.1em .34em;border:3px solid var(--line);border-radius:12px;color:#2a1000;
  background:linear-gradient(180deg,var(--fire3),var(--fire2) 55%,var(--fire1));
  box-shadow:0 5px 0 var(--line),inset 0 2px 0 rgba(255,255,255,.55);transition:transform .08s,box-shadow .08s,filter .15s;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.dark{background:linear-gradient(180deg,#4a2c66,#2c1740);color:var(--cream);text-shadow:none}
.btn.cyan{background:linear-gradient(180deg,#9be8ff,#35b6ff);color:#04233a}
.btn.small{font-size:16px;padding:.35em .8em .28em;border-width:2px;box-shadow:0 3px 0 var(--line)}
.btn[disabled]{filter:grayscale(.9) brightness(.7);pointer-events:none}
.back{font-family:var(--fd);font-size:22px;letter-spacing:.05em;padding:6px 14px;border:2px solid var(--line);border-radius:10px;background:#2c1740;box-shadow:0 3px 0 #000}

/* ---------- tags */
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font:800 10px/1 var(--fu);text-transform:uppercase;letter-spacing:.04em;padding:3px 5px 2px;border-radius:4px;
  color:#120818;background:var(--c,#999);border:1px solid rgba(0,0,0,.6);white-space:nowrap}

/* ---------- boot */
#s-boot{align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
#s-boot img{width:min(78vw,560px);filter:drop-shadow(0 10px 30px rgba(255,90,20,.35))}
#bootMsg{color:var(--muted);font-size:15px;max-width:420px;line-height:1.45}
#bootBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ---------- menu */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;position:relative;z-index:2}
.pcard{display:flex;align-items:center;gap:10px;min-width:0;background:rgba(18,8,24,.72);border:2px solid #000;border-radius:12px;padding:6px 10px 6px 6px;box-shadow:0 3px 0 #000}
.pcard canvas{width:40px;height:40px;border-radius:8px;border:2px solid #000;background:#2c1740;image-rendering:pixelated;flex:none}
.pname{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.elo{font-family:var(--fd);font-size:20px;color:var(--fire3);margin-left:4px;letter-spacing:.04em}
.wallet{display:flex;align-items:center;gap:6px;background:rgba(18,8,24,.72);border:2px solid #000;border-radius:999px;padding:5px 6px 5px 8px;box-shadow:0 3px 0 #000;font-weight:800;font-size:16px}
.wallet .plus{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--fire2);color:#2a1000;font-weight:900;border:2px solid #000}
.bk{width:24px;height:24px;flex:none;object-fit:contain;vertical-align:middle;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}

.menu-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr);gap:4px 20px;padding:0 4vw 22px;align-items:center}
.hero{grid-column:1 / -1;display:flex;justify-content:center}
.hero img{width:min(44vw,48vh,500px);filter:drop-shadow(0 8px 26px rgba(255,90,20,.35));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-.6deg)}}
.fighter{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-height:0;position:relative}
.fighter canvas{width:100%;flex:1;min-height:120px;max-height:46vh}
.fname{font-family:var(--fd);font-size:28px;letter-spacing:.05em;line-height:1;text-shadow:0 3px 0 #000}
.flv{color:var(--muted);font-size:13px;margin:2px 0 8px;font-weight:600}
.mainbtns{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,14px);align-items:stretch;max-width:380px;width:100%;justify-self:center}
.mainbtns .btn{text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mainbtns .btn small{font:700 12px var(--fu);letter-spacing:0;opacity:.75;text-transform:none}
.mainbtns .btn.big{font-size:clamp(26px,3.4vmin + 10px,42px);transform:skew(-4deg)}
.mainbtns .btn.big:active{transform:skew(-4deg) translateY(4px)}
.demo-badge{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font:700 11px var(--fu);color:var(--muted);opacity:.8;white-space:nowrap}
@media (max-aspect-ratio: 1/1){
  .menu-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;padding:0 16px 22px}
  .hero img{width:min(80vw,42vh)}
  .fighter canvas{max-height:30vh}
  .mainbtns{max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mainbtns .btn.big{grid-column:1 / -1}
  .mainbtns .btn{font-size:20px;padding:.45em .7em .35em}
  .mainbtns .btn small{display:none}
}

/* ---------- generic panel screens */
.head{display:flex;align-items:center;gap:12px;padding:12px}
.head h2{margin:0;font-family:var(--fd);font-weight:400;font-size:clamp(28px,5vmin,40px);letter-spacing:.05em;text-shadow:0 3px 0 #000;flex:1}
.panel{background:rgba(30,15,42,.86);border:2px solid #000;border-radius:var(--r);box-shadow:0 4px 0 #000}

/* characters */
.chars{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:12px;padding:0 12px 12px}
.cdetail{padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.cdetail canvas.big{width:100%;height:clamp(150px,30vh,280px)}
.rar{font:800 11px var(--fu);text-transform:uppercase;letter-spacing:.08em}
.cname{font-family:var(--fd);font-size:34px;letter-spacing:.04em;line-height:1}
.xpbar{height:12px;border:2px solid #000;border-radius:8px;background:#120818;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#9be8ff);transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{background:#120818;border:2px solid #000;border-radius:8px;padding:6px;text-align:center}
.stats b{display:block;font-family:var(--fd);font-size:22px;font-weight:400;letter-spacing:.04em}
.stats span{font-size:10px;color:var(--muted);font-weight:700}
.skill{display:flex;gap:10px;align-items:center;background:#120818;border:2px solid #000;border-radius:10px;padding:8px}
.skill.locked{opacity:.5}
.skill svg{width:34px;height:34px;flex:none}
.skill b{font-size:14px} .skill p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;padding:12px;align-content:start}
.ccard{position:relative;background:#120818;border:3px solid var(--rc,#555);border-radius:12px;padding:8px 6px 6px;text-align:center;box-shadow:0 3px 0 #000}
.ccard canvas{width:56px;height:56px;image-rendering:pixelated;border-radius:6px}
.ccard .n{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .l{font-size:10px;color:var(--muted);font-weight:700}
.ccard.lock canvas{filter:grayscale(1) brightness(.35)}
.ccard.lock .n{color:var(--muted)}
.ccard.sel{outline:3px solid var(--fire3);outline-offset:2px}
.ccard .use{position:absolute;top:-8px;right:-6px;background:var(--fire3);color:#2a1000;font:900 9px var(--fu);padding:2px 5px;border-radius:6px;border:2px solid #000}
@media (max-aspect-ratio: 1/1){
  .chars{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}
  .cdetail{overflow:visible}
  .cdetail canvas.big{height:22vh}
}

/* queue */
#s-queue{align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.radar{width:min(46vmin,240px);aspect-ratio:1;border-radius:50%;position:relative;border:3px solid #000;
  background:radial-gradient(circle,#2c1740 0 30%,#1e0f2a 31% 60%,#2c1740 61%);box-shadow:0 0 0 6px rgba(255,138,31,.15),0 0 60px rgba(255,90,20,.25)}
.radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,201,60,.55),transparent 25%);animation:spin 1.6s linear infinite}
.radar canvas{position:absolute;inset:18%;width:64%;height:64%;image-rendering:pixelated}
@keyframes spin{to{transform:rotate(360deg)}}
.qtitle{font-family:var(--fd);font-size:clamp(30px,6vmin,46px);letter-spacing:.05em;text-shadow:0 3px 0 #000}
.qinfo{color:var(--muted);font-weight:600;font-size:14px}

/* battle HUD */
#s-battle{pointer-events:none}
#s-battle .ui{pointer-events:auto}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;padding:8px 10px 0}
.hpbox{display:flex;flex-direction:column;gap:3px;min-width:0}
.hpbox.r{align-items:flex-end}
.hpbox .who{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.hpbox.r .who{flex-direction:row-reverse}
.hpbox .nm{font-family:var(--fd);font-size:clamp(16px,2.4vmin + 6px,26px);letter-spacing:.04em;text-shadow:0 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;width:100%;height:clamp(14px,2.2vmin + 6px,24px);border:3px solid #000;border-radius:6px;background:#3a0d14;overflow:hidden;box-shadow:0 3px 0 #000;transform:skew(-12deg)}
.hpbox.r .bar{transform:skew(12deg)}
.bar .chip,.bar .fill{position:absolute;top:0;bottom:0;left:0;width:100%}
.hpbox.r .bar .chip,.hpbox.r .bar .fill{left:auto;right:0}
.bar .chip{background:#fff3b0;transition:width .7s ease-in .25s}
.bar .fill{background:linear-gradient(180deg,#ffe36b,#ffb11f 55%,#ff7a1a);transition:width .12s}
.bar .fill.low{background:linear-gradient(180deg,#ff8a8a,#ff3b4a)}
.bar .shield{position:absolute;inset:0;border:2px solid var(--cyan);display:none;box-shadow:inset 0 0 10px var(--cyan)}
.bar .shield.on{display:block}
.hpbox .sub{font-size:11px;font-weight:700;color:var(--muted);text-shadow:0 1px 0 #000}
.hpbox .hpn{font-family:var(--fd);font-size:14px;letter-spacing:.05em;text-shadow:0 2px 0 #000}
.timer{font-family:var(--fd);font-size:clamp(30px,5vmin + 8px,54px);line-height:1;min-width:2.1em;text-align:center;padding:2px 8px;
  background:#120818;border:3px solid #000;border-radius:10px;box-shadow:0 3px 0 #000;color:var(--fire3)}
.timer.hot{color:var(--bad);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.combo{position:absolute;left:12px;top:clamp(78px,13vmin,110px);font-family:var(--fd);font-size:clamp(26px,5vmin,46px);letter-spacing:.04em;color:var(--fire3);text-shadow:0 3px 0 #000;opacity:0;transition:opacity .2s}
.combo small{display:block;font-size:.45em;color:var(--cream);margin-top:-4px}
.combo.on{opacity:1}
.quit{position:absolute;right:10px;bottom:10px;font:800 12px var(--fu);padding:6px 10px;border-radius:8px;background:rgba(18,8,24,.7);border:2px solid #000;color:var(--muted)}
.bigtext{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--fd);text-align:center}
#countdown{font-size:clamp(90px,26vmin,220px);color:var(--fire3);-webkit-text-stroke:4px #000;text-shadow:0 8px 0 #000}
#countdown.pop{animation:cd .9s ease-out}
@keyframes cd{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
#vs{display:none;background:radial-gradient(ellipse at center,rgba(18,8,24,.4),rgba(18,8,24,.85))}
#vs.on{display:grid}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4vw;width:min(92vw,900px)}
.vsrow .p{display:flex;flex-direction:column;gap:6px;align-items:center}
.vsrow .p b{font-size:clamp(26px,5vmin,48px);letter-spacing:.04em;text-shadow:0 3px 0 #000;font-weight:400}
.vsrow .v{font-size:clamp(60px,14vmin,130px);color:var(--fire2);-webkit-text-stroke:3px #000;text-shadow:0 6px 0 #000;animation:pulse .6s infinite alternate}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0}
#banner div{display:inline-block;font-family:var(--fd);font-size:clamp(26px,5vmin,48px);letter-spacing:.05em;padding:6px 26px;transform:skew(-8deg);
  border:3px solid #000;background:linear-gradient(90deg,var(--violet),var(--cyan));color:#120818;box-shadow:0 5px 0 #000}
#banner.opp div{background:linear-gradient(90deg,#ff4d5e,#ff8a1f)}
#banner.on{animation:ban 1.3s ease-out}
@keyframes ban{0%{opacity:0;transform:translateX(-30%)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateX(20%)}}

/* result */
.overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,4,14,.78);padding:16px;z-index:5;pointer-events:auto}
.overlay.on{display:grid;animation:scrIn .3s}
.result{width:min(92vw,440px);padding:20px;text-align:center;display:flex;flex-direction:column;gap:12px}
.result h1{margin:0;font-family:var(--fd);font-weight:400;font-size:clamp(56px,14vmin,92px);line-height:.9;letter-spacing:.04em;-webkit-text-stroke:3px #000;text-shadow:0 6px 0 #000}
.result h1.win{color:var(--fire3)} .result h1.lose{color:#9aa4b2} .result h1.draw{color:var(--cyan)}
.rrow{display:flex;justify-content:space-between;align-items:center;background:#120818;border:2px solid #000;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;gap:8px}
.rrow .d{font-family:var(--fd);font-size:24px;letter-spacing:.04em;font-weight:400}
.up{color:var(--good)} .down{color:var(--bad)}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* store */
.tabs{display:flex;gap:8px;padding:0 12px 10px}
.tab{font-family:var(--fd);font-size:20px;letter-spacing:.05em;padding:6px 16px;border:2px solid #000;border-radius:10px;background:#2c1740;box-shadow:0 3px 0 #000;color:var(--muted)}
.tab.on{background:var(--fire3);color:#2a1000}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:4px 12px 16px}
.item{padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.item .ic{width:84px;height:84px;display:grid;place-items:center}
.item h3{margin:0;font-family:var(--fd);font-weight:400;font-size:26px;letter-spacing:.04em}
.item p{margin:0;color:var(--muted);font-size:13px}
.item .amt{font-family:var(--fd);font-size:30px;color:var(--fire3);display:flex;gap:6px;align-items:center}
.gacha{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;margin:0 12px 16px}
.gacha .stage{display:flex;gap:6px;justify-content:center;height:150px;align-items:flex-end}
.gacha .stage canvas{height:150px;width:80px}
.rates{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:12px;font-weight:700}
.rates span{padding:3px 8px;border-radius:6px;border:2px solid #000;color:#120818}
.pull{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;width:100%;max-height:60vh;overflow:auto;padding:6px}
.pcardg{perspective:600px;height:150px}
.pcardg .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.pcardg.flip .in{transform:rotateY(180deg)}
.pcardg .f,.pcardg .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #000;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 0 #000}
.pcardg .f{background:repeating-linear-gradient(45deg,#ff8a1f 0 10px,#ff6a1a 10px 20px);font-family:var(--fd);font-size:40px;color:#2a1000}
.pcardg .b{transform:rotateY(180deg);background:#120818;border-color:var(--rc)}
.pcardg .b canvas{width:56px;height:96px}
.pcardg .b .n{font-size:11px;font-weight:800}
.pcardg .b .s{font-size:10px;font-weight:900}
.pcardg.legendary .b{box-shadow:0 0 22px var(--rc),0 3px 0 #000}

/* leaderboard */
.lb{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:42px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:rgba(30,15,42,.86);border:2px solid #000;border-radius:10px}
.lrow.me{border-color:var(--fire3)}
.lrow .pos{font-family:var(--fd);font-size:24px;text-align:center;letter-spacing:.03em}
.lrow.g .pos{color:#ffd54f} .lrow.s .pos{color:#d6dde6} .lrow.b .pos{color:#e6a06b}
.lrow canvas{width:36px;height:36px;border-radius:6px;image-rendering:pixelated;border:2px solid #000}
.lrow .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .e{font-family:var(--fd);font-size:22px;color:var(--fire3);text-align:right;letter-spacing:.04em}
.lrow .e small{display:block;font:700 10px var(--fu);color:var(--muted)}
.mepos{margin:0 12px 12px;padding:10px 12px}

/* modal + toast */
#modal{z-index:20}
.mbox{width:min(92vw,420px);padding:20px;display:flex;flex-direction:column;gap:14px;text-align:center}
.mbox h3{margin:0;font-family:var(--fd);font-weight:400;font-size:32px;letter-spacing:.04em}
.mbox p{margin:0;color:var(--muted);line-height:1.45}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-220%);visibility:hidden;z-index:30;padding:10px 16px;border:2px solid #000;border-radius:10px;background:var(--cream);color:#120818;font-weight:800;font-size:14px;box-shadow:0 4px 0 #000;transition:transform .25s;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0);visibility:visible}
.spin{width:28px;height:28px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--fire3);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}

/* gacha roll */
.rcard{position:relative;height:160px;border:3px solid var(--rc,#3a2a48);border-radius:12px;background:#120818;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:6px 4px;box-shadow:0 3px 0 #000;overflow:hidden;transition:border-color .08s}
.rcard canvas{width:64px;height:104px;position:relative;z-index:1}
.rcard .n,.rcard .s{position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rcard .n{font-size:12px;font-weight:800}
.rcard .s{font-size:10px;font-weight:900;color:var(--rc)}
.rcard.rolling canvas{filter:blur(1.3px) brightness(.8);animation:rollY .14s linear infinite}
.rcard.rolling::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 3px,transparent 3px 7px);animation:scan .25s linear infinite}

@keyframes shake{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
.rcard.landed{animation:land .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(1.3)}100%{transform:scale(1)}}

  flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-width:100%;min-width:0;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;overscroll-behavior-x:contain;-webkit-mask-image:none;mask-image:none;touch-action:pan-x pan-y}

.tags .tag{flex:none}
.lrow>div,.hrow .vs>div,.frow>div,.aprow .an{min-width:0}
/* fade edges = "there is more, swipe" */
.tags.more-r{-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent) !important;mask-image:linear-gradient(90deg,#000 80%,transparent) !important}
.tags.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%) !important;mask-image:linear-gradient(90deg,transparent,#000 20%) !important}
.tags.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent) !important;mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent) !important}

.frsec-req{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* comeback badge (only for the player who is behind) */
.comeback{position:absolute;left:12px;top:clamp(128px,21vmin,170px);z-index:4;font:800 13px var(--fu);color:#2a1000;background:linear-gradient(90deg,#ffd54f,#ff8a1f);border:2px solid #000;border-radius:999px;padding:4px 10px;box-shadow:0 3px 0 #000;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;pointer-events:none}
.comeback.on{opacity:1;transform:none;animation:cbpulse 1.1s ease-in-out infinite}
@keyframes cbpulse{50%{box-shadow:0 3px 0 #000,0 0 16px #ff8a1f}}
body.phone .comeback{top:auto;bottom:64px;left:8px;font-size:12px}
</style>
</head>

<script>/* =====================================================================
 *  BAKWAN FIGHT BACK — shared core
 *  This exact code runs in two places:
 *    1. Wix backend  (backend/bfbCore.js)  -> the real, authoritative game server
 *    2. Game client  (demo / offline mode) -> so you can test without Wix
 *  >>> To change stats, skills, prices, ranks: edit CONFIG below in
 *      backend/bfbCore.js on Wix. The game reads it from the server.
 * ===================================================================== */
var BFB = (function () {
  'use strict';

  /* ------------------------------------------------------------------
   * CONFIG — everything you are likely to tune lives here
   * ------------------------------------------------------------------ */
  var CONFIG = {
    version: 1,
    build: '20261025-130337',          // stamped automatically by the build; players auto-refresh when it changes
    startElo: 100,
    startBakwan: 100,            // free bakwan for new players (= 1 gacha pull). Set 0 to disable.

    ranks: [
      { min: 0,    max: 200,    name: 'Murid Baru',       color: '#9aa4b2' },
      { min: 201,  max: 500,    name: 'Murid Normal',     color: '#4fc3f7' },
      { min: 501,  max: 1000,   name: 'Murid Nakal',      color: '#7bd88f' },
      { min: 1001, max: 1500,   name: 'Preman Sekolah',   color: '#ffb74d' },
      { min: 1501, max: 2000,   name: 'Pentolan Sekolah', color: '#ff6b5b' },
      { min: 2001, max: 4999,   name: 'Jagoan Sekolah',   color: '#ffd54f' },
      { min: 5000, max: 999999, name: 'Legenda Sekolah',  color: '#ff5cf0' }
    ],
    specialTags: {                // value of the "specialTag" field on a player (set it in the CMS)
      'Pemain BFB': '#ff9f1c'
    },
    teladan: { name: 'Murid Teladan', color: '#f2e9ff', top: 5, minWins: 1 },  // automatic tag for the leaderboard Top 5
    botTagColor: '#c792ea',

    elo: {
      kRanked: 40,               // Elo K-factor vs real players
      kBot: 20,                  // Elo K-factor vs bots
      floor: 0,
      botAfterSec: 20,           // no opponent found after N seconds -> bot match
      windowStart: 150,          // matchmaking Elo window, grows while waiting
      windowGrowPerSec: 25
    },

    match: {
      durationMs: 90000,         // round length
      countdownMs: 4000,         // 3-2-1-FIGHT
      maxOnScreen: 5,            // max circles/shapes on screen at once
      lateMs: 260,               // how long a circle stays after its perfect moment
      shapeLifeMs: 2600          // how long a skill shape stays
    },

    // Fake-out bombs: look like circles (same shrinking outline). Tapping one hurts YOU.
    bomb: { enabled: true, firstMs: 5000, gapMinMs: 4500, gapMaxMs: 8500, selfPct: 6 },  // selfPct = % of your max HP

    timing: {                    // |tap time - perfect time| in ms
      perfect: 70, great: 140, good: 230, earlyMiss: 450
    },
    mult: { perfect: 1.0, great: 0.75, good: 0.5, ok: 0.25, miss: 0 },
    combo: { perStep: 0.02, maxSteps: 15 },   // +2% damage per combo, max +30%

    level: {
      max: 50,                   // level cap
      xpBase: 100,               // xp from Lv1 -> Lv2
      xpStep: 20,                // each next level needs +20 more

  function eloDelta(ra, rb, score, K) {

  function publicConfig() { return JSON.parse(JSON.stringify(CONFIG)); }

  /* ==================================================================

    function err(code) { var e = new Error(code); e.code = code; return e; }

    function newId(prefix) { return prefix + now().toString(36) + Math.floor(random() * 1e9).toString(36); }

    /* ---------------- live settings */
    async function loadSettings(force) {
      if (!force && now() - _settings.at < 30000 && now() >= _settings.at && _settings.doc) return _settings.doc;
      var stored = null;
      try { stored = await db.get('Settings', 'config'); } catch (e) { stored = null; }
      var doc = stored || { _id: 'config', rev: 0, overrides: {}, announcement: '', forceReloadAt: 0 };

    }
    function isBanned(p) { return !!(p && p.banned && (!p.bannedUntil || p.bannedUntil > now())); }
    function err2(code, extra) { var e = err(code); Object.assign(e, extra || {}); return e; }

    /* ---------------- daily rewards */
    function dayKey(t) { return new Date(t + CONFIG.daily.tzOffsetMin * 60000).toISOString().slice(0, 10); }
    function msToNextDay(t) { var off = CONFIG.daily.tzOffsetMin * 60000, d = 86400000; return d - ((t + off) % d); }
    // gives the reward once per day; returns the amount given (0 if already claimed today)
    function grantDaily(p, key, amount) {
      var today = dayKey(now());

    }
    function dailyView(p) {
      var d = (p.daily && p.daily.day === dayKey(now())) ? p.daily : {}, D = CONFIG.daily;
      return { login: !!d.login, ranked: !!d.ranked, train: !!d.train, amounts: { login: D.login, ranked: D.firstRanked, train: D.firstTrain }, resetInMs: msToNextDay(now()) };
    }

    async function getPlayer(ctx) {
      var p = await db.get('Players', ctx.memberId);
      if (!p) {
        p = { _id: ctx.memberId, name: cleanName(ctx.name), elo: CONFIG.startElo, peakElo: CONFIG.startElo,
          bakwan: CONFIG.startBakwan, specialTag: '', selectedChar: 'botak', wins: 0, losses: 0, draws: 0,
          items: {}, createdAt: now(), lastTrainAt: 0, lastMatchId: '' };
        await db.save('Players', p);
        await db.save('Owned', { _id: ctx.memberId + '__botak', memberId: ctx.memberId, charId: 'botak', xp: 0, obtainedAt: now() });
      } else if (ctx.name && !p.customName && cleanName(ctx.name) !== p.name) {
        p.name = cleanName(ctx.name); await db.save('Players', p);
      }
      if (!p.items) p.items = {};
      if (isBanned(p) && !ctx.allowBanned) throw err2('BANNED', { reason: p.banReason || '', until: p.bannedUntil || 0 });
      if (!p.friendCode) { p.friendCode = await newFriendCode(); await db.save('Players', p); }
      return p;
    }
    async function newFriendCode() {
      var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      for (var tries = 0; tries < 20; tries++) {
        var c = ''; for (var i = 0; i < 6; i++) c += A[Math.floor(random() * A.length)];
        if (await db.insertOnce('Locks', { _id: 'fc_' + c, at: now() })) return c;
      }
      throw err('CODE_FAIL');
    }
    async function ownedMap(memberId) {
      var list = await db.ownedBy(memberId), m = {};
      for (var i = 0; i < list.length; i++) {
        var li = levelInfo(list[i].xp);
        m[list[i].charId] = { xp: list[i].xp, level: li.level, into: li.into, need: li.need, max: li.max };
      }
      if (!m.botak) {
        await db.save('Owned', { _id: memberId + '__botak', memberId: memberId, charId: 'botak', xp: 0, obtainedAt: now() });
        m.botak = { xp: 0, level: 1, into: 0, need: xpToNext(1), max: false };
      }
      return m;
    }
    async function topList() {
      var t = now();
      if (!_topCache.list || t - _topCache.at > 15000 || t < _topCache.at) {
        _topCache = { at: t, list: (await db.topPlayers(70)).filter(function (x) { return !isBanned(x); }) };
      }
      return _topCache.list;
    }
    function dropTopCache() { _topCache = { at: -1e15, list: null }; }
    async function top5Ids() {
      var T = CONFIG.teladan;

    }
    async function markTeladan(p) { p.teladan = (await top5Ids()).indexOf(p._id) >= 0; return p; }
    async function playerView(p) {
      await markTeladan(p);

        items: p.items || {}, selectedChar: p.selectedChar, wins: p.wins, losses: p.losses, draws: p.draws, specialTag: p.specialTag || '', daily: dailyView(p) };
    }
    async function addXp(memberId, charId, xp) {

      var before = levelInfo(o.xp).level;
      o.xp = (o.xp || 0) + xp; await db.save('Owned', o);

    }

    /* ---------------- bootstrap */
    async function bootstrap(ctx) {
      var set = await loadSettings();

      if (isBanned(p0)) return { config: publicConfig(), banned: { reason: p0.banReason || '', until: p0.bannedUntil || 0 }, serverNow: now() };
      var p = p0;
      await settleStale(p);
      p = await db.get('Players', ctx.memberId); p.lastActive = now();
      var dailyLogin = grantDaily(p, 'login', CONFIG.daily.login);
      await db.save('Players', p);

        isAdmin: !!ctx.isAdmin, cfgRev: set.rev || 0, announcement: set.announcement || '', forceReloadAt: set.forceReloadAt || 0 };
    }
    async function settleStale(p) {

    async function selectChar(ctx, charId) {

      return { player: await playerView(p) };
    }

    /* ---------------- matchmaking */
    function windowFor(entry, t) { var E = CONFIG.elo; return Math.min(2500, E.windowStart + E.windowGrowPerSec * Math.max(0, (t - entry.joinedAt) / 1000)); }

    async function queueJoin(ctx) {
      var p = await getPlayer(ctx);
      await settleStale(p);
      p = await db.get('Players', ctx.memberId);
      var owned = await ownedMap(ctx.memberId);
      var charId = owned[p.selectedChar] ? p.selectedChar : 'botak';
      await db.remove('Pending', ctx.memberId);

      await db.save('Queue', entry);

    }
    async function queuePoll(ctx) {
      var pend = await db.get('Pending', ctx.memberId);

      var entry = await db.get('Queue', ctx.memberId);

      entry.lastSeen = now(); await db.save('Queue', entry);

      return { status: 'waiting', since: entry.joinedAt, window: Math.round(windowFor(entry, now())) };
    }
    async function queueLeave(ctx) {
      var entry = await db.get('Queue', ctx.memberId);

        // someone is matching us right now -> let the match happen

        if (pend) return { status: 'matched', matchId: pend.matchId };
      }
      await db.remove('Queue', ctx.memberId);
      return { status: 'left' };

    async function tryMatch(me) {
      var t = now(), list = await db.queueList(t - 8000), cands = [];

        if (d <= windowFor(me, t) && d <= windowFor(c, t)) cands.push({ c: c, d: d });
      }
      cands.sort(function (a, b) { return a.d - b.d; });

        if (!(await db.insertOnce('Locks', { _id: 'tk_' + me.ticket, at: t }))) return null; // we are being taken
        if (await db.insertOnce('Locks', { _id: 'tk_' + cands[j].c.ticket, at: t })) {

    async function sideInfo(memberId, charId) {

      if (!o) { charId = 'botak'; o = await db.get('Owned', memberId + '__botak'); }
      var lv = levelInfo(o ? o.xp : 0).level, st = statsOf(charId, lv);
      return { memberId: memberId, name: p.name, elo: p.elo, specialTag: p.specialTag || '', isBot: false,
        charId: charId, level: lv, stats: st, tags: tagsOf(p) };
    }
    async function createMatch(a, b, mode) {

        startAt: t + 2500 + M.countdownMs, durationMs: M.durationMs, status: 'live', A: A, B: B, result: null,
        pA: A.memberId, pB: B.memberId, endedAt: 0 };
      await db.save('Matches', m);
      await db.save('Sides', Object.assign({ _id: id + '_A', matchId: id }, newSide()));
      await db.save('Sides', Object.assign({ _id: id + '_B', matchId: id }, newSide()));
      for (var k of [A, B]) {
        var p = await db.get('Players', k.memberId); p.lastMatchId = id; p.lastMatchAt = t; await db.save('Players', p);
        if (m.mode === 'ranked') { await db.save('Pending', { _id: k.memberId, matchId: id, at: t }); publish(k.memberId, { type: 'matchFound', matchId: id }); }
      }
      await db.remove('Queue', a._id); await db.remove('Queue', b._id);
      return id;
    }
    async function queueBot(ctx) {
      var pend = await db.get('Pending', ctx.memberId);
      if (pend) { await db.remove('Pending', ctx.memberId); await db.remove('Queue', ctx.memberId); return { status: 'matched', matchId: pend.matchId }; }
      var entry = await db.get('Queue', ctx.memberId);
      if (!entry) throw err('NOT_IN_QUEUE');
      if (!(await db.insertOnce('Locks', { _id: 'tk_' + entry.ticket, at: now() }))) return { status: 'waiting' };
      await db.remove('Queue', ctx.memberId);
      var A = await sideInfo(ctx.memberId, entry.charId);
      var id = await createBotMatch(A);

    }
    async function createBotMatch(A) {

      var B = { memberId: null, isBot: true, name: CONFIG.botNames[Math.floor(random() * CONFIG.botNames.length)],
        elo: elo, specialTag: '', charId: cd.id, level: lv, stats: JSON.parse(JSON.stringify(A.stats)) };
      B.tags = tagsOf(B);

        status: 'live', pA: A.memberId, pB: '', endedAt: 0, A: A, B: B, botEvents: botPlan(seed, { atk: B.stats.atk, charId: B.charId, level: B.level }, A.stats.def, acc), result: null };
      await db.save('Matches', m);
      await db.save('Sides', Object.assign({ _id: id + '_A', matchId: id }, newSide()));

    }

    /* ---------------- match state */
    function trimSide(s) {

        misses: s.misses, bombed: s.bombed || 0, bombs: s.bombs || 0, shields: s.shields || [], rages: s.rages || [] };
    }
    function hps(m, sA, sB, t) {
      var tBot = (m.mode === 'bot' && sA.koAt) ? Math.min(t, sA.koAt - m.startAt) : t;
      var takenA = m.mode === 'bot' ? botDealt(m.botEvents, tBot, sA) : sB.dealt;
      return { A: hpOf(m.A.stats.hp, sA.healed, takenA + (sA.bombed || 0)), B: hpOf(m.B.stats.hp, sB.healed, sA.dealt + (sB.bombed || 0)) };
    }
    function mySideOf(m, memberId) { return m.A.memberId === memberId ? 'A' : (m.B.memberId === memberId ? 'B' : null); }
    function matchView(m, side, sA, sB) {

        mySide: side, A: m.A, B: m.B, botEvents: m.botEvents || null,

    }
    async function getMatch(ctx, matchId) {
      var m = await db.get('Matches', matchId);

      var side = mySideOf(m, ctx.memberId); if (!side) throw err('NOT_IN_MATCH');

    }
    async function sendHits(ctx, matchId, actions) {

          // remember the exact moment our knock-out blow landed (decides double-KO races)

        }

    }
    async function finishMatch(ctx, matchId) {

      var t = now() - m.startAt;
      var sd = await Promise.all([db.get('Sides', matchId + '_A'), m.mode === 'bot' ? Object.assign({ _id: matchId + '_B', matchId: matchId }, newSide()) : db.get('Sides', matchId + '_B')]), sA = sd[0], sB = sd[1];

    async function resolve(m, reason) {

        return m;

      var sd = await Promise.all([db.get('Sides', m._id + '_A'), db.get('Sides', m._id + '_B')]), sA = sd[0], sB = sd[1];

        var info = m[s], o = s === 'A' ? m.B : m.A;
        if (info.isBot || !info.memberId) continue;
        var score = winner === 'draw' ? 0.5 : (winner === s ? 1 : 0);
        var p = await db.get('Players', info.memberId);
        if (m.mode === 'friendly') {
          p.lastMatchAt = 0; await db.save('Players', p);
          var fx = CONFIG.rewards.xpFriendly, flv = await addXp(info.memberId, info.charId, fx);
          res[s] = { friendly: true, eloBefore: p.elo, eloAfter: p.elo, delta: 0, rankBefore: rankOf(p.elo).name, rankAfter: rankOf(p.elo).name,
            xp: fx, charId: info.charId, levelBefore: flv ? flv.levelBefore : 1, levelAfter: flv ? flv.levelAfter : 1, levelInfo: flv ? flv.info : null };
          continue;
        }
        var before = p.elo, delta = eloDelta(before, o.elo, score, K);
        if (score === 1 && delta < 1) delta = 1;
        p.elo = Math.max(CONFIG.elo.floor, before + delta);
        p.peakElo = Math.max(p.peakElo || 0, p.elo);
        p.lastMatchAt = 0;
        if (score === 1) p.wins = (p.wins || 0) + 1; else if (score === 0) p.losses = (p.losses || 0) + 1; else p.draws = (p.draws || 0) + 1;
        var dailyBonus = grantDaily(p, 'ranked', CONFIG.daily.firstRanked);
        await db.save('Players', p);
        var xp = score === 1 ? CONFIG.rewards.xpWin : score === 0 ? CONFIG.rewards.xpLose : CONFIG.rewards.xpDraw;
        var lv = await addXp(info.memberId, info.charId, xp);
        res[s] = { eloBefore: before, eloAfter: p.elo, delta: p.elo - before, rankBefore: rankOf(before).name, rankAfter: rankOf(p.elo).name,
          xp: xp, charId: info.charId, levelBefore: lv ? lv.levelBefore : 1, levelAfter: lv ? lv.levelAfter : 1, levelInfo: lv ? lv.info : null,
          dailyBonus: dailyBonus, bakwan: p.bakwan };
      }
      m.status = 'done'; m.result = res; m.endedAt = now();
      await db.save('Matches', m);
      for (var s2 of ['A', 'B']) if (m[s2].memberId) publish(m[s2].memberId, { type: 'mend', matchId: m._id, result: res });
      return m;
    }

    /* ---------------- store (in-game currency) */
    async function gacha(ctx, count) {
      count = count === 10 ? 10 : 1;
      var G = CONFIG.store.gacha, price = count === 10 ? G.ten : G.single;
      var p = await getPlayer(ctx);
      if ((p.bakwan || 0) < price) throw err('NOT_ENOUGH_BAKWAN');
      p.bakwan -= price; await db.save('Players', p);
      var owned = await ownedMap(ctx.memberId), out = [];
      var pools = {}; CONFIG.characters.forEach(function (c) { if (G.rates[c.rarity] != null) (pools[c.rarity] = pools[c.rarity] || []).push(c); });
      var total = 0, rar = Object.keys(G.rates).filter(function (r) { return pools[r]; });
      rar.forEach(function (r) { total += G.rates[r]; });
      for (var i = 0; i < count; i++) {
        var x = random() * total, pick = rar[rar.length - 1];
        for (var k = 0; k < rar.length; k++) { if (x < G.rates[rar[k]]) { pick = rar[k]; break; } x -= G.rates[rar[k]]; }
        var pool = pools[pick], c = pool[Math.floor(random() * pool.length)];
        if (owned[c.id]) {
          await addXp(ctx.memberId, c.id, CONFIG.rewards.dupXp);
          out.push({ charId: c.id, rarity: pick, isNew: false, xp: CONFIG.rewards.dupXp });
        } else {
          await db.save('Owned', { _id: ctx.memberId + '__' + c.id, memberId: ctx.memberId, charId: c.id, xp: 0, obtainedAt: now() });
          owned[c.id] = { xp: 0, level: 1 };
          out.push({ charId: c.id, rarity: pick, isNew: true, xp: 0 });
        }
      }
      return { results: out, player: await playerView(p), owned: await ownedMap(ctx.memberId) };
    }
    function itemDef(id) { var it = CONFIG.store.items; for (var i = 0; i < it.length; i++) if (it[i].id === id) return it[i]; return null; }
    async function buyItem(ctx, itemId, qty) {
      var it = itemDef(itemId); if (!it) throw err('NO_ITEM');
      qty = clamp(Math.floor(qty || 1), 1, 99);
      var p = await getPlayer(ctx), cost = it.price * qty;
      if ((p.bakwan || 0) < cost) throw err('NOT_ENOUGH_BAKWAN');
      p.bakwan -= cost; p.items[itemId] = (p.items[itemId] || 0) + qty;
      await db.save('Players', p);
      return { player: await playerView(p) };
    }
    async function useItem(ctx, itemId, charId, qty) {
      var it = itemDef(itemId); if (!it) throw err('NO_ITEM');

    /* ---------------- friends */
    function pairId(x, y) { return x < y ? x + '__' + y : y + '__' + x; }
    function isOnline(p) { return now() - (p.lastActive || 0) < CONFIG.friends.onlineWindowSec * 1000; }
    async function touch(p) { p.lastActive = now(); await db.save('Players', p); }
    async function friendView(f, me) {
      var other = f.a === me ? f.b : f.a, p = await db.get('Players', other);
      if (!p) return null;
      await markTeladan(p);
      return { id: other, name: p.name, elo: p.elo, tags: tagsOf(p), charId: p.selectedChar || 'botak', wins: p.wins || 0, losses: p.losses || 0,
        online: isOnline(p), inMatch: !!(p.lastMatchId && p.lastMatchAt && now() - p.lastMatchAt < (M.durationMs + 15000)),
        status: f.status, outgoing: f.status === 'pending' && f.from === me };
    }
    async function friendsList(ctx) {
      var p = await getPlayer(ctx); await touch(p);
      var list = await db.friendsOf(ctx.memberId), out = [];
      for (var i = 0; i < list.length; i++) { var v = await friendView(list[i], ctx.memberId); if (v) out.push(v); }
      out.sort(function (a, b) { return (b.online - a.online) || (b.elo - a.elo); });
      return {
        myCode: p.friendCode,
        friends: out.filter(function (f) { return f.status === 'accepted'; }),
        incoming: out.filter(function (f) { return f.status === 'pending' && !f.outgoing; }),

    async function addFriend(ctx, code) {
      code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      var me = await getPlayer(ctx);
      if (code === me.friendCode) throw err('SELF_FRIEND');
      var other = await db.findPlayerByCode(code);
      if (!other) throw err('NO_SUCH_CODE');
      var mine = await db.friendsOf(ctx.memberId);
      if (mine.length >= CONFIG.friends.max) throw err('FRIENDS_FULL');
      var id = pairId(ctx.memberId, other._id), f = await db.get('Friends', id);
      if (f && f.status === 'accepted') return { status: 'already', name: other.name };
      if (f && f.status === 'pending' && f.from !== ctx.memberId) {           // they already asked us -> accept
        f.status = 'accepted'; f.at = now(); await db.save('Friends', f);
        publish(other._id, { type: 'friendAccepted', name: me.name });
        return { status: 'accepted', name: other.name };
      }
      if (!f) {
        await db.save('Friends', { _id: id, a: id.split('__')[0], b: id.split('__')[1], from: ctx.memberId, status: 'pending', at: now() });
        publish(other._id, { type: 'friendReq', name: me.name });
      }
      return { status: 'sent', name: other.name };
    }
    async function respondFriend(ctx, otherId, accept) {
      var id = pairId(ctx.memberId, otherId), f = await db.get('Friends', id);
      if (!f || f.status !== 'pending' || f.from === ctx.memberId) throw err('NO_REQUEST');
      if (accept) {
        f.status = 'accepted'; f.at = now(); await db.save('Friends', f);
        var me = await getPlayer(ctx); publish(otherId, { type: 'friendAccepted', name: me.name });

    async function respondAllFriends(ctx, accept) {
      var list = (await db.friendsOf(ctx.memberId)).filter(function (f) { return f.status === 'pending' && f.from !== ctx.memberId; });
      var me = accept ? await getPlayer(ctx) : null, n = 0;
      if (accept) {
        var have = (await db.friendsOf(ctx.memberId)).filter(function (f) { return f.status === 'accepted'; }).length;
        list = list.slice(0, Math.max(0, CONFIG.friends.max - have));
      }
      for (var i = 0; i < list.length; i++) {
        var f = list[i], other = f.a === ctx.memberId ? f.b : f.a;

    async function challenge(ctx, otherId) {
      var f = await db.get('Friends', pairId(ctx.memberId, otherId));
      if (!f || f.status !== 'accepted') throw err('NOT_FRIENDS');
      var me = await getPlayer(ctx), owned = await ownedMap(ctx.memberId);
      var since = now() - CONFIG.friends.challengeTimeoutSec * 1000;
      // already challenged this friend? reuse it instead of sending a second one
      var mine = (await db.challengesFor(otherId, since)).filter(function (x) { return x.from === ctx.memberId; })[0];
      if (mine) return { id: mine._id, timeoutSec: Math.max(1, Math.ceil((mine.at + CONFIG.friends.challengeTimeoutSec * 1000 - now()) / 1000)), reused: true };
      // they challenged us at the same time? -> just accept theirs
      var theirs = (await db.challengesFor(ctx.memberId, since)).filter(function (x) { return x.from === otherId; })[0];
      if (theirs) {
        var acc = await challengeRespond(ctx, theirs._id, true);
        return { id: theirs._id, status: 'accepted', matchId: acc.matchId, timeoutSec: 0 };
      }
      var c = { _id: newId('c'), from: ctx.memberId, to: otherId, fromName: me.name, fromElo: me.elo,
        fromChar: owned[me.selectedChar] ? me.selectedChar : 'botak', status: 'pending', at: now(), matchId: '' };
      await db.save('Challenges', c);
      publish(otherId, { type: 'challenge', id: c._id, fromId: ctx.memberId, fromName: me.name, fromElo: me.elo });
      return { id: c._id, timeoutSec: CONFIG.friends.challengeTimeoutSec };

      if (c.status === 'pending' && now() - c.at > CONFIG.friends.challengeTimeoutSec * 1000) { c.status = 'expired'; await db.save('Challenges', c); }
      return { status: c.status, matchId: c.matchId || '' };
    }
    async function challengeCancel(ctx, id) {

      if (c && c.from === ctx.memberId && c.status === 'pending') { c.status = 'cancelled'; await db.save('Challenges', c); publish(c.to, { type: 'challengeGone', id: id }); }
      return { status: 'cancelled' };

    async function challengeRespond(ctx, id, accept) {
      var c = await db.get('Challenges', id);

        selectedChar: p.selectedChar || 'botak', daily: dailyView(p),

    }
    async function adminAction(ctx, pid, action, data) {

      data = data || {};
      if ((action === 'ban' || action === 'kick') && pid === ctx.memberId) throw err('SELF_ADMIN');
      var p = await db.get('Players', pid); if (!p) throw err('NO_PLAYER');

        case 'setBakwan': p.bakwan = Math.max(0, num(data.value)); note = { value: p.bakwan }; break;

        case 'charXp': {

    }

    }
    async function adminLog(ctx) { needAdmin(ctx); return { log: await db.recentLog(60) }; }

    async function profile(ctx) {
      var p = await getPlayer(ctx);
      return { player: await playerView(p), owned: await ownedMap(ctx.memberId) };
    }

    var methods = {
      adminOverview: adminOverview, adminSearch: adminSearch, adminPlayer: adminPlayer, adminAction: adminAction,
      adminGetSettings: adminGetSettings, adminSaveSettings: adminSaveSettings, adminAnnounce: adminAnnounce,
      adminForceRefresh: adminForceRefresh, adminLog: adminLog,

    xpToNext: xpToNext, levelInfo: levelInfo, statsOf: statsOf, skillsOf: skillsOf, skillForShape: skillForShape,

    botPlan: botPlan, botDealt: botDealt, botAccuracy: botAccuracy, applyActions: applyActions, eloDelta: eloDelta,
    publicConfig: publicConfig, createService: createService,
    setConfig: function (c) { CONFIG = c; this.CONFIG = c; _schedCache = {}; },
    baseConfig: function () { return JSON.parse(JSON.stringify(BASE)); }
  };
  return API;
})();

  // Slot-machine style roll: every card cycles through random characters, slows down, then lands.
  function showRoll(results) {
    var R = CFG().rarities, rates = CFG().store.gacha.rates;
    var pool = CFG().characters.filter(function (c) { return rates[c.rarity] != null; });
    var single = results.length === 1;
    var html = '<h3>' + (single ? 'Gacha!' : 'Gacha 10x!') + '</h3><div class="pull roll' + (single ? ' one' : '') + '">' +
      results.map(function () { return '<div class="rcard rolling"><canvas></canvas><div class="n">???</div><div class="s">&nbsp;</div></div>'; }).join('') +
      '</div><div class="rbtns"><button class="btn small dark" id="gSkip">Lewati</button><button class="btn small" id="gOk" disabled>OK</button></div>';
    modal(html, function (m) {
      var cards = $$('.rcard', m), timers = [], landed = 0;
      cards.forEach(function (cd) { Previews.add($('canvas', cd), pool[0].skin, { still: true }); });
      function land(i) {
        var cd = cards[i]; if (cd.dataset.done) return; cd.dataset.done = '1';
        var x = results[i], c = BFB.charDef(x.charId), rr = R[x.rarity] || {};
        Previews.setKey($('canvas', cd), c.skin, { still: false, glow: (rr.color || '#fff') + '55' });
        cd.classList.remove('rolling', 'tease'); cd.classList.add('landed', x.rarity);
        cd.style.setProperty('--rc', rr.color);
        $('.n', cd).textContent = c.name;
        $('.s', cd).textContent = x.isNew ? 'BARU! · ' + rr.label : '+' + x.xp + ' XP';
        Sfx.play(x.rarity === 'legendary' ? 'legend' : x.rarity === 'rare' ? 'win' : 'flip');
        if (++landed === cards.length) { $('#gOk', m).disabled = false; $('#gSkip', m).style.display = 'none'; }
      }
      function roll(i, duration) {
        var cd = cards[i], cvs = $('canvas', cd), t0 = performance.now(), last = -1;
        (function step() {
          if (cd.dataset.done) return;
          var el = performance.now() - t0;
          if (el >= duration) return land(i);
          var k; do { k = Math.floor(Math.random() * pool.length); } while (k === last && pool.length > 1); last = k;
          Previews.setKey(cvs, pool[k].skin);
          cd.style.setProperty('--rc', (R[pool[k].rarity] || {}).color);
          if (results[i].rarity === 'legendary' && el > duration - 700) cd.classList.add('tease');
          Sfx.play('tick');
          timers.push(setTimeout(step, 50 + Math.pow(el / duration, 3) * 330));
        })();
      }
      cards.forEach(function (cd, i) { roll(i, single ? 2800 : 1600 + i * 300); });
      $('#gSkip', m).onclick = function () { timers.forEach(clearTimeout); cards.forEach(function (c, i) { land(i); }); };
      $('#gOk', m).onclick = function () { timers.forEach(clearTimeout); closeModal(); renderStore(); };
    }, 'wide');
  }

    else if (p.type === 'challengeGone') { if (G.modalKind === 'in_' + p.id) { closeModal(); toast('Tantangan dibatalkan.'); } }

  /* ================================================================ REALTIME RELAY (Ably, optional)
   * Hits are sent player-to-player through Ably (~50-150 ms) so the opponent sees them instantly.
   * Each client re-computes the opponent's damage with the same rules as the server, so fake
   * messages can't do anything. The Wix server still validates every hit and decides the KO. */
  var Relay = {
    client: null, ch: null, ok: false, matchId: null,
    loadSdk: function () {
      if (window.Ably) return Promise.resolve();
      if (this._sdk) return this._sdk;
      this._sdk = new Promise(function (res, rej) {
        var sc = document.createElement('script'); sc.src = 'https://cdn.ably.com/lib/ably.min-2.js'; sc.async = true;
        sc.onload = function () { res(); }; sc.onerror = function () { Relay._sdk = null; rej(new Error('sdk')); };
        document.head.appendChild(sc); setTimeout(function () { rej(new Error('sdk timeout')); }, 8000);

    start: async function (matchId) {
      this.stop();

        await this.loadSdk();
        if (this.matchId !== matchId) return;
        var client = new Ably.Realtime({
          echoMessages: false,
          authCallback: function (params, cb) { api('relayToken', matchId).then(function (tr) { cb(null, tr); }, function (e) { cb(e.code || 'AUTH', null); }); }
        });
        this.client = client;
        client.connection.on(function (chg) { Relay.ok = chg.current === 'connected' && !!Relay.ch; Relay.badge(); if (chg.current === 'failed') Relay.stop(); });
        var ch = client.channels.get('bfb-match-' + matchId);
        await ch.subscribe('a', function (msg) { onRelay(msg.data); });
        if (this.matchId !== matchId) { client.close(); return; }
        this.ch = ch; this.ok = client.connection.state === 'connected'; this.badge();
      } catch (e) { this.stop(); }
    },
    send: function (data) { if (this.ok && this.ch) this.ch.publish('a', data).catch(function () {}); },
    stop: function () { try { if (this.client) this.client.close(); } catch (e) {} this.client = null; this.ch = null; this.ok = false; this.matchId = null; this.badge(); },
    badge: function () { var b = $('#liveBadge'); if (b) b.classList.toggle('on', this.ok); }

  function onRelay(d) {
    if (!d || !B.on || B.ended || !B.m || d.m !== B.m.id || d.s !== B.op || !Array.isArray(d.a)) return;
    var t = clamp(serverNow() - B.m.startAt, 0, B.m.durationMs);
    var evs = BFB.applyActions({ seed: B.m.seed, me: B.oppSim, opp: B.L, meInfo: B.opp, oppInfo: B.me, actions: d.a.slice(0, 10),

    return Object.assign({}, server, { dealt: Math.max(server.dealt || 0, sim.dealt || 0), healed: Math.max(server.healed || 0, sim.healed || 0),

  }

      api('finishMatch', B.m.id).then(function (r) { if (r.status === 'done' && r.result) showResult(r.result); }).catch(function () {});
    }
  }

  /* --- results */
  function showResult(res) {
    if (!B.on || B.resultShown) return;
    B.resultShown = true; B.ended = true;
    var me = res[B.my] || {}, win = res.winner === B.my, draw = res.winner === 'draw', now = performance.now();
    B.awaitKO = false; $('#waitko').classList.remove('on'); setTimeout(function () { Relay.stop(); }, 1500);
    var byKo = res.hp && (res.hp.A <= 0 || res.hp.B <= 0);
    if (win) { B.F.L.winAt = now; if (byKo) B.F.R.koAt = now; }
    else if (!draw) { B.F.R.winAt = now; if (byKo) B.F.L.koAt = now; }
    else if (byKo) { B.F.L.koAt = now; B.F.R.koAt = now; }
    if (byKo) { Sfx.play('ko'); B.shake = 18; var ce = $('#countdown'); ce.textContent = 'K.O.!'; ce.classList.remove('pop'); void ce.offsetWidth; ce.classList.add('pop'); B.cd = 'K.O.!'; }
    var st = res.stats ? res.stats[B.my] : B.L;
    var rows = '';
    if (me.dailyBonus) rows += '<div class="rrow dailyrow"><span>🎁 Bonus ranked pertama hari ini</span><span class="d up">+' + me.dailyBonus + ' ' + BK + '</span></div>';
    if (me.friendly) {
      rows += '<div class="rrow" style="justify-content:center;color:var(--muted)">Duel teman · Unranked · Elo tidak berubah</div>';
      rows += '<div class="rrow"><span>+' + me.xp + ' XP · ' + esc(BFB.charDef(me.charId).name) + '</span><span class="d ' + (me.levelAfter > me.levelBefore ? 'up' : '') + '">Lv ' + me.levelAfter + '</span></div>';
    } else if (me.eloBefore != null) {
      rows += '<div class="rrow"><span>Elo</span><span>' + me.eloBefore + ' → <b>' + me.eloAfter + '</b></span><span class="d ' + (me.delta >= 0 ? 'up' : 'down') + '">' + (me.delta >= 0 ? '+' : '') + me.delta + '</span></div>';
      if (me.rankBefore !== me.rankAfter) {
        var up = me.eloAfter > me.eloBefore, rk = BFB.rankOf(me.eloAfter);
        rows += '<div class="rrow" style="justify-content:center;gap:10px"><span>' + (up ? 'NAIK PANGKAT!' : 'Turun pangkat') + '</span><span class="tag" style="--c:' + rk.color + '">' + esc(rk.name) + '</span></div>';
      }
      var c = BFB.charDef(me.charId);
      rows += '<div class="rrow"><span>+' + me.xp + ' XP · ' + esc(c.name) + '</span><span class="d ' + (me.levelAfter > me.levelBefore ? 'up' : '') + '">Lv ' + me.levelAfter + '</span></div>';
      if (me.levelAfter > me.levelBefore) {
        BFB.skillsOf(me.charId, me.levelAfter).forEach(function (s) { if (s.unlock > me.levelBefore && s.unlock <= me.levelAfter) rows += '<div class="rrow" style="justify-content:center">Skill baru: <b>&nbsp;' + esc(s.name) + '</b></div>'; });
      }
    }
    rows += '<div class="rrow"><span>Perfect ' + (st.perfects || 0) + '</span><span>Hit ' + (st.hits || 0) + '</span><span>Max combo ' + (st.maxCombo || 0) + '</span>' + (st.bombs ? '<span style="color:var(--bad)">Bom ' + st.bombs + '</span>' : '') + '</div>';
    setTimeout(function () {
      if (!B.on) return;
      var r = $('#result');
      r.innerHTML = '<div class="panel result"><h1 class="' + (win ? 'win' : draw ? 'draw' : 'lose') + '">' + (win ? 'MENANG!' : draw ? 'SERI' : 'KALAH') + '</h1>' +
        '<div style="color:var(--muted);font-weight:700">' + (res.reason === 'ko' ? 'K.O.' : 'Waktu habis') + ' · vs ' + esc(B.opp.name) + '</div>' + rows +
        '<div class="rbtns"><button class="btn small dark" data-go="menu">Menu</button>' + (B.kind === 'friendly' ? '<button class="btn small" data-go="friends">Teman</button>' : '<button class="btn small" data-go="ranked">Main Lagi</button>') + '</div></div>';
      r.classList.add('on'); Sfx.play(win ? 'win' : 'lose');
    }, 1300);
    api('profile').then(function (p) { setPlayer(p.player); setOwned(p.owned); }).catch(function () {});
  }
  async function endTrain() {
    if (B.ended) return; B.ended = true;
    var s = B.L, judged = s.hits + s.misses, acc = judged ? Math.round(s.perfects / judged * 100) : 0, xpRow = '';
    try {
      var r = await api('trainDone', B.me.charId, { hits: s.hits, perfects: s.perfects, maxCombo: s.maxCombo });
      if (r.owned) setOwned(r.owned);
      if (r.dailyBonus) { xpRow += '<div class="rrow dailyrow"><span>🎁 Bonus latihan pertama hari ini</span><span class="d up">+' + r.dailyBonus + ' ' + BK + '</span></div>'; refreshProfile(true); }
      xpRow += r.xp ? '<div class="rrow"><span>XP latihan</span><span class="d up">+' + r.xp + '</span></div>' :
        '<div class="rrow" style="justify-content:center;color:var(--muted)">' + (r.cooldown ? 'XP latihan bisa didapat lagi setelah ' + CFG().rewards.trainCooldownSec + ' detik' : 'Kena minimal 10 lingkaran untuk dapat XP') + '</div>';
    } catch (e) {}
    var res = $('#result');
    res.innerHTML = '<div class="panel result"><h1 class="draw" style="font-size:clamp(44px,10vmin,72px)">LATIHAN SELESAI</h1>' +
      '<div class="rrow"><span>Total damage</span><span class="d">' + fmt(s.dealt) + '</span></div>' +
      '<div class="rrow"><span>Perfect</span><span class="d">' + s.perfects + ' <small style="font:700 12px var(--fu);color:var(--muted)">(' + acc + '%)</small></span></div>' +
      '<div class="rrow"><span>Hit / Miss</span><span class="d">' + s.hits + ' / ' + s.misses + '</span></div>' +
      '<div class="rrow"><span>Max combo</span><span class="d">' + s.maxCombo + '</span></div>' + xpRow +
      '<div class="rbtns"><button class="btn small dark" data-go="menu">Menu</button><button class="btn small cyan" data-go="train">Latihan Lagi</button></div></div>';
    res.classList.add('on'); Sfx.play('win');
  }

  /* ================================================================ MENU BACKGROUND */
  var bgc = $('#bg'), bgg = bgc.getContext('2d'), embers = [];
  for (var ei = 0; ei < 60; ei++) embers.push({ x: Math.random(), y: Math.random(), s: 1 + Math.random() * 3, v: 0.02 + Math.random() * 0.06, w: Math.random() * 6 });
  function drawMenuBg(ts) {
    var w = W, h = H; bgg.setTransform(DPR, 0, 0, DPR, 0, 0);
    var gr = bgg.createRadialGradient(w * 0.5, h * 1.05, 10, w * 0.5, h * 0.7, Math.max(w, h) * 0.9);
    gr.addColorStop(0, '#5a1a2a'); gr.addColorStop(0.45, '#2a1036'); gr.addColorStop(1, '#120818');
    bgg.fillStyle = gr; bgg.fillRect(0, 0, w, h);
    bgg.save(); bgg.globalAlpha = 0.06; bgg.translate(w / 2, h * 0.42); bgg.rotate(ts / 40000);
    bgg.fillStyle = '#ff8a1f';
    for (var i = 0; i < 16; i++) { bgg.rotate(Math.PI / 8); bgg.beginPath(); bgg.moveTo(0, 0); bgg.lineTo(Math.max(w, h), -60); bgg.lineTo(Math.max(w, h), 60); bgg.fill(); }
    bgg.restore();
    for (var j = 0; j < embers.length; j++) {
      var e = embers[j]; e.y -= e.v * 0.016; if (e.y < -0.05) { e.y = 1.05; e.x = Math.random(); }
      var x = e.x * w + Math.sin(ts / 900 + e.w) * 12, y = e.y * h;
      bgg.globalAlpha = 0.25 + 0.5 * (1 - e.y); bgg.fillStyle = j % 3 ? '#ff8a1f' : '#ffc93c'; bgg.fillRect(x, y, e.s, e.s);
    }
    bgg.globalAlpha = 1;
  }

  function loop(ts) {
    requestAnimationFrame(loop);
    if (B.on && G.screen === 'battle') battleFrame(ts); else drawMenuBg(ts);
    Previews.draw(ts);
  }

  /* ================================================================ BOOT */
  function startDemo() {
    G.mode = 'demo'; Mock = makeMock(); loadProfile();
  }
  function onAuth(m) {
    if (G.mode === 'demo') return;
    G.query = m.query || {};
    if (!m.loggedIn) {
      G.authed = false;
      bootMsg('Masuk ke akun website dulu untuk main <b>Bakwan Fight Back</b>.', [['Masuk / Daftar', function () { Bridge.post({ type: 'login' }); }]]);
      return;
    }
    if (m.server && m.token) Net.setup(m.server, m.token);
    if (G.mode === 'wix' && G.player) return;
    G.authed = true; G.mode = 'wix'; loadProfile();
  }
  async function loadProfile() {
    bootMsg('Memuat profil…', [], true);
    try {
      var t0 = Date.now(), r = await apiRetry('bootstrap');
      syncClock(r.serverNow, t0, Date.now());
      checkBuild(r.config && r.config.build);
      if (r.banned) return showBanned(r.banned);
      BFB.setConfig(r.config); G.relay = !!r.relay;
      G.isAdmin = !!r.isAdmin; G.cfgRev = r.cfgRev || 0; G.bootAt = r.serverNow; G.frAt = r.forceReloadAt || 0; G.kicked = false; G.banned = null;
      $$('.adminbtn').forEach(function (b) { b.hidden = !G.isAdmin; }); showAnnouncement(r.announcement || '');
      setPlayer(r.player); setOwned(r.owned); renderMenu(); show('menu');
      if (r.dailyLogin > 0) setTimeout(function () { if (!modalOpen()) { Sfx.play('win'); openDaily('Hadiah Login Harian!', r.dailyLogin); } }, 600);
      checkPendingTopup(false); refreshInbox();
    } catch (e) {
      bootMsg('Gagal memuat: ' + esc(e.msg || e.message), [['Coba lagi', loadProfile]]);
    }
  }
  async function boot() {
    $$('img.logo').forEach(function (i) { i.src = ASSETS.logo; });
    $$('.bkicon').forEach(function (s) { s.innerHTML = BK; });
    resize(); requestAnimationFrame(loop); FS.update();
    await Promise.all(Object.keys(ASSETS.skins).map(function (k) { return Skins.load(k); }));
    if (document.fonts && document.fonts.load) { try { await Promise.race([document.fonts.load('40px Bangers'), sleep(1500)]); } catch (e) {} }
    if (!Bridge.inIframe) { bootMsg('Versi demo — progres disimpan di browser ini.', [['Main Demo', startDemo]]); return; }
    var tries = 0;
    var iv = setInterval(function () {
      if (G.authed !== undefined || G.mode) { clearInterval(iv); return; }
      Bridge.post({ type: 'ready' });
      if (++tries === 14) bootMsg('Belum terhubung ke website.<br><small>Pastikan page code sudah dipasang (lihat panduan).</small>', [['Main Demo', startDemo, 'dark']], true);
    }, 500);
    Bridge.post({ type: 'ready' });
  }
  window.BFB_DEBUG = { Net: Net, setBg: function (k) { B.bg = k; bgCache = null; }, get B() { return B; }, get G() { return G; }, serverNow: serverNow, tap: function (x, y) { tap(x, y); }, L: function () { return L(); }, pos: pos };
  boot();
})();
</script>
</body>
</html>
